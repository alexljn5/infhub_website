# ============================================================
# INFHUB Docker Compose Stack
# ============================================================
# Manages the complete INFHUB web/IRC stack:
#   - php-app: Apache + PHP 8.4 website (port 8080)
#   - db: MariaDB 11 (internal only, no host port)
#   - inspircd: InspIRCd 4.x IRC server (ports 6667, 6697)
#   - lounge: The Lounge IRC web client (port 9000)
#
# TheLounge connects to InspIRCd via the Compose network
# (service name: inspircd, ports: 6667 plaintext / 6697 TLS).
#
# Persistent data:
#   - db-data: MariaDB data (named volume)
#   - inspircd-data: InspIRCd data (named volume)
#   - /home/alexljn5/.thelounge: TheLounge config (bind mount)
#   - /home/alexljn5/INFHUB/inf_irc/inspircd/run: InspIRCd config (bind mount)
# ============================================================

services:
  php-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-app
    container_name: infhub-website-php-app-1
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: infhub_database
      DB_USER: infhub_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      LOUNGE_HOST: lounge
      LOUNGE_PORT: 9000
    networks:
      - infhub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  db:
    image: mariadb:11
    container_name: infhub-website-db-1
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: infhub_database
      MARIADB_USER: infhub_user
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-storage-engine=InnoDB
    volumes:
      - db-data:/var/lib/mysql
      - ./src/database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - infhub-network
  # No host port exposed — internal only

  inspircd:
    build:
      context: .
      dockerfile: Dockerfile
      target: inspircd
    container_name: infhub-website-inspircd-1
    restart: always
    ports:
      - "6667:6667"
      - "6697:6697"
    volumes:
      - /home/alexljn5/INFHUB/inf_irc/inspircd/run:/home/inspircd/inspircd/run
      - inspircd-data:/home/inspircd/inspircd/data
      - /etc/ssl/certs/irc.crt:/etc/ssl/certs/irc.crt:ro
    environment:
      - INSPIRCD_HOME=/home/inspircd/inspircd
    depends_on:
      db:
        condition: service_healthy
    networks:
      - infhub-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6667"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  lounge:
    image: ghcr.io/thelounge/thelounge:latest
    container_name: infhub_lounge
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /home/alexljn5/.thelounge:/var/opt/thelounge
      - /etc/ssl/certs/irc.crt:/etc/ssl/certs/irc.crt:ro
    environment:
      - THELOUNGE_HOME=/var/opt/thelounge
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/irc.crt
    depends_on:
      inspircd:
        condition: service_started
    networks:
      - infhub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  infhub-network:
    driver: bridge

volumes:
  db-data:
  inspircd-data:
